<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaka Anahtarlık Fabrikası</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 500px; max-width: 100%; }
        h2 { color: #333; margin-top: 0; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: 600; color: #555; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 200px; padding: 8px 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: right; }
        input:read-only { background: #f5f5f5; color: #666; }
        .full-width { width: 100%; display: block; margin-bottom: 8px; }
        .full-width input { width: 100%; text-align: left; }

        .vehicle-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .vehicle-btn { flex: 1; padding: 12px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: #666; transition: all 0.2s; text-align: center; }
        .vehicle-btn:hover { border-color: #007bff; }
        .vehicle-btn.active { border-color: #007bff; background: #e7f3ff; color: #007bff; }
        .vehicle-btn .emoji { display: block; font-size: 22px; margin-bottom: 4px; }

        .color-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .color-btn { flex: 1; padding: 12px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; color: white; transition: all 0.2s; }
        .color-btn.mavi { background: #003399; }
        .color-btn.kirmizi { background: #CC0000; }
        .color-btn.active { border-color: #333; box-shadow: 0 0 0 2px white inset; }

        #canvas-container { width: 100%; height: 280px; background: #e9ecef; border-radius: 8px; margin: 15px 0; position: relative; overflow: hidden; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        button.action-btn { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background: #0056b3; }
        button.action-btn:disabled { background: #ccc; cursor: not-allowed; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
        .status { font-size: 12px; color: #28a745; text-align: center; font-weight: bold; margin-bottom: 10px; padding: 6px; border-radius: 4px; }
        .status.error { color: #dc3545; background: #f8d7da; }
        .status.loading { color: #856404; background: #fff3cd; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚗 Plaka Anahtarlık Fabrikası</h2>

    <label style="display:block; margin-bottom:6px;">Araç Tipi:</label>
    <div class="vehicle-selector">
        <button class="vehicle-btn active" id="btnAraba" onclick="setVehicle('araba')">
            <span class="emoji">🚗</span>Otomobil
        </button>
        <button class="vehicle-btn" id="btnMoto" onclick="setVehicle('moto')">
            <span class="emoji">🏍️</span>Motosiklet
        </button>
    </div>

    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start;">
        <label for="plakaText">Plaka Yazısı:</label>
        <input type="text" id="plakaText" value="06 DDV 18" oninput="updateKeychain()" style="margin-top: 5px;">
    </div>

    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start;">
        <label for="isimText">İsim (Alt Yazı):</label>
        <input type="text" id="isimText" value="DD_VECTOR" oninput="updateKeychain()" style="margin-top: 5px;">
    </div>

    <label style="display:block; margin-bottom:6px;">TR Kutusu Rengi:</label>
    <div class="color-selector">
        <button class="color-btn mavi active" id="btnMavi" onclick="setColor('mavi')">🔵 MAVİ</button>
        <button class="color-btn kirmizi" id="btnKirmizi" onclick="setColor('kirmizi')">🔴 KIRMIZI</button>
    </div>

    <hr>

    <div class="form-group">
        <label for="uzunlukInput">Uzunluk (mm):</label>
        <input type="number" id="uzunlukInput" value="100" min="40" max="300" oninput="updateKeychain()">
    </div>
    <div class="form-group">
        <label for="yukseklikInput">Yükseklik (mm):</label>
        <input type="number" id="yukseklikInput" value="21.2" readonly>
    </div>
    <div class="form-group">
        <label for="kalinlikInput">Kalınlık (mm):</label>
        <input type="number" id="kalinlikInput" value="3" min="1" max="10" step="0.5" oninput="updateKeychain()">
    </div>
    <div class="form-group">
        <label for="delikInput">Delik Çapı (mm):</label>
        <input type="number" id="delikInput" value="5" min="2" max="10" step="0.5" oninput="updateKeychain()">
    </div>

    <div id="status" class="status loading">Font yükleniyor...</div>

    <div id="canvas-container"></div>

    <button class="action-btn" id="downloadBtn" onclick="downloadSTL()" disabled>📥 STL İndir</button>
</div>

<script>
    let scene, camera, renderer, controls, keychainGroup, loadedFont = null;

    const VEHICLE_SETTINGS = {
        araba: { oran: 520 / 110, varsayilanUzunluk: 100, isim: 'Otomobil' },
        moto:  { oran: 240 / 150, varsayilanUzunluk: 70,  isim: 'Motosiklet' }
    };

    const RENKLER = { mavi: 0x003399, kirmizi: 0xCC0000 };

    let currentVehicle = 'araba';
    let currentColor = 'mavi';

    const KABARTMA_ORANI = 0.35;

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe9ecef);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -150, 90);
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, -30, 50);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
        backLight.position.set(-20, 30, -30);
        scene.add(backLight);

        loadFont();
        animate();
    }

    function loadFont() {
        const statusEl = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        statusEl.innerText = "Font yükleniyor...";
        statusEl.className = "status loading";

        const loader = new THREE.FontLoader();
        loader.load(
            'Open_Sans_Regular.json',
            function (font) {
                loadedFont = font;
                statusEl.innerText = "✅ Font yüklendi! Hazır.";
                statusEl.className = "status";
                downloadBtn.disabled = false;
                updateKeychain();
            },
            undefined,
            function () {
                statusEl.innerText = "❌ Font yüklenemedi!";
                statusEl.className = "status error";
            }
        );
    }

    function setVehicle(type) {
        currentVehicle = type;
        document.getElementById('btnAraba').classList.toggle('active', type === 'araba');
        document.getElementById('btnMoto').classList.toggle('active', type === 'moto');
        document.getElementById('uzunlukInput').value = VEHICLE_SETTINGS[type].varsayilanUzunluk;
        updateKeychain();
    }

    function setColor(color) {
        currentColor = color;
        document.getElementById('btnMavi').classList.toggle('active', color === 'mavi');
        document.getElementById('btnKirmizi').classList.toggle('active', color === 'kirmizi');
        updateKeychain();
    }

    function hesaplaYukseklik(uzunluk) {
        return (uzunluk / VEHICLE_SETTINGS[currentVehicle].oran).toFixed(1);
    }

    function createRoundedRectShape(width, height, radius) {
        const shape = new THREE.Shape();
        const x = -width / 2;
        const y = -height / 2;
        radius = Math.min(radius, width / 2, height / 2);

        shape.moveTo(x, y + radius);
        shape.lineTo(x, y + height - radius);
        shape.quadraticCurveTo(x, y + height, x + radius, y + height);
        shape.lineTo(x + width - radius, y + height);
        shape.quadraticCurveTo(x + width, y + height, x + width, y + height - radius);
        shape.lineTo(x + width, y + radius);
        shape.quadraticCurveTo(x + width, y, x + width - radius, y);
        shape.lineTo(x + radius, y);
        shape.quadraticCurveTo(x, y, x, y + radius);
        return shape;
    }

    function updateKeychain() {
        if (!scene || !loadedFont) return;
        if (keychainGroup) scene.remove(keychainGroup);

        keychainGroup = new THREE.Group();

        const uzunluk = parseFloat(document.getElementById('uzunlukInput').value) || 100;
        const yukseklik = parseFloat(hesaplaYukseklik(uzunluk));
        document.getElementById('yukseklikInput').value = yukseklik;
        
        const kalinlik = parseFloat(document.getElementById('kalinlikInput').value) || 3;
        const delikCap = parseFloat(document.getElementById('delikInput').value) || 5;
        const plakaText = document.getElementById('plakaText').value || "06 DDV 18";
        const isimText = document.getElementById('isimText').value || "DD_VECTOR";
        const trRenk = RENKLER[currentColor];

        const kabartmaYuksekligi = kalinlik * KABARTMA_ORANI;
        const plakaYuksekligi = kalinlik - kabartmaYuksekligi;

        // Malzemeler
        const beyazMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });
        const siyahMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.5 });
        const trMat = new THREE.MeshStandardMaterial({ color: trRenk, roughness: 0.3 });
        const siyahTextMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.3 });
        const beyazTextMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.3 });

        // Oranlar
        const kenarlikKalinlik = yukseklik * 0.07;
        const isimlikYukseklik = yukseklik * 0.28;
        const ustAlanYukseklik = yukseklik - isimlikYukseklik;

        // DELİK: SOL ALT KÖŞE (isim barının hizasında)
        const delikMerkezX = -uzunluk / 2 + kenarlikKalinlik + delikCap / 2 + 1;
        const delikMerkezY = -yukseklik / 2 + kenarlikKalinlik + isimlikYukseklik / 2;

        // Z katmanları (yazıların zemine basması için)
        const beyazZ = plakaYuksekligi; // Beyaz plaka siyah kenarlığın tam üstünde
        const kabartmaYazZ = beyazZ;    // Yazılar beyaz zeminin üstünde başlar

        // ============================================
        // 1. SİYAH KENARLIK (En dış katman) - DELİKLİ
        // ============================================
        const disShape = createRoundedRectShape(uzunluk, yukseklik, 2);
        const disDelik = new THREE.Path();
        disDelik.absarc(delikMerkezX, delikMerkezY, delikCap / 2, 0, Math.PI * 2, true);
        disShape.holes.push(disDelik);
        
        const disGeo = new THREE.ExtrudeGeometry(disShape, {
            depth: plakaYuksekligi,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 1,
            bevelSize: 0.1,
            bevelThickness: 0.1
        });
        disGeo.center();
        const disMesh = new THREE.Mesh(disGeo, siyahMat);
        disMesh.position.set(0, 0, plakaYuksekligi / 2);
        keychainGroup.add(disMesh);

        // ============================================
        // 2. BEYAZ PLAKA (Siyah kenarlığın içinde) - DELİKLİ!
        // ============================================
        const icGenislik = uzunluk - kenarlikKalinlik * 2;
        const icYukseklik = yukseklik - kenarlikKalinlik * 2;
        const icShape = createRoundedRectShape(icGenislik, icYukseklik, 1);
        
        // ÖNEMLİ: Beyaz plakaya da aynı deliği aç (karşıdan karşıya geçsin)
        const icDelik = new THREE.Path();
        icDelik.absarc(delikMerkezX, delikMerkezY, delikCap / 2, 0, Math.PI * 2, true);
        icShape.holes.push(icDelik);
        
        const icGeo = new THREE.ExtrudeGeometry(icShape, {
            depth: 0.2,
            bevelEnabled: false
        });
        icGeo.center();
        const icMesh = new THREE.Mesh(icGeo, beyazMat);
        icMesh.position.set(0, 0, beyazZ + 0.1);
        keychainGroup.add(icMesh);

        // ============================================
        // 3. TR KUTUSU (Sol üst)
        // ============================================
        const trKutuGenislik = ustAlanYukseklik * 0.7;
        const trKutuYukseklik = ustAlanYukseklik * 0.7;
        const trKutuX = -uzunluk / 2 + kenarlikKalinlik + trKutuGenislik / 2 + 1;
        const trKutuY = yukseklik / 2 - kenarlikKalinlik - trKutuYukseklik / 2 - 1;

        // TR kutusu - zemine basması için Z konumu beyazZ
        const trKutuGeo = new THREE.BoxGeometry(trKutuGenislik, trKutuYukseklik, kabartmaYuksekligi);
        const trKutuMesh = new THREE.Mesh(trKutuGeo, trMat);
        trKutuMesh.position.set(trKutuX, trKutuY, beyazZ + 0.1 + kabartmaYuksekligi / 2);
        keychainGroup.add(trKutuMesh);

        // TR yazısı
        const trFontSize = trKutuYukseklik * 0.6;
        const trGeo = new THREE.TextGeometry("TR", {
            font: loadedFont,
            size: trFontSize,
            height: kabartmaYuksekligi * 0.5,
            curveSegments: 8
        });
        trGeo.computeBoundingBox();
        const trWidth = trGeo.boundingBox.max.x - trGeo.boundingBox.min.x;
        const trMesh = new THREE.Mesh(trGeo, beyazTextMat);
        trMesh.position.set(
            trKutuX - trWidth / 2,
            trKutuY - trFontSize / 2.5,
            beyazZ + 0.1 + kabartmaYuksekligi
        );
        keychainGroup.add(trMesh);

        // ============================================
        // 4. PLAKA YAZISI (Beyaz zemin üstünde siyah kabartma - ZEMİNE BASAR)
        // ============================================
        const plakaYaziAlanX = trKutuX + trKutuGenislik / 2 + 2;
        const plakaYaziAlanGenislik = (uzunluk / 2) - plakaYaziAlanX - kenarlikKalinlik - 2;
        const plakaYaziFontSize = ustAlanYukseklik * 0.7;
        const plakaYaziY = yukseklik / 2 - kenarlikKalinlik - ustAlanYukseklik / 2;

        let plakaTextGeo;
        try {
            plakaTextGeo = new THREE.TextGeometry(plakaText, {
                font: loadedFont,
                size: plakaYaziFontSize,
                height: kabartmaYuksekligi * 0.5,
                curveSegments: 8
            });
        } catch(e) {
            plakaTextGeo = new THREE.TextGeometry("PLAKA", {
                font: loadedFont,
                size: plakaYaziFontSize,
                height: kabartmaYuksekligi * 0.5,
                curveSegments: 8
            });
        }
        
        plakaTextGeo.computeBoundingBox();
        let plakaTextWidth = plakaTextGeo.boundingBox.max.x - plakaTextGeo.boundingBox.min.x;
        let plakaTextHeight = plakaTextGeo.boundingBox.max.y - plakaTextGeo.boundingBox.min.y;

        if (plakaTextWidth > plakaYaziAlanGenislik && plakaTextWidth > 0) {
            const scale = plakaYaziAlanGenislik / plakaTextWidth;
            const newSize = plakaYaziFontSize * scale;
            plakaTextGeo.dispose();
            plakaTextGeo = new THREE.TextGeometry(plakaText, {
                font: loadedFont,
                size: newSize,
                height: kabartmaYuksekligi * 0.5,
                curveSegments: 8
            });
            plakaTextGeo.computeBoundingBox();
            plakaTextWidth = plakaTextGeo.boundingBox.max.x - plakaTextGeo.boundingBox.min.x;
        }

        const maxPlakaYaziYukseklik = ustAlanYukseklik * 0.85;
        if (plakaTextHeight > maxPlakaYaziYukseklik && plakaTextHeight > 0) {
            const scale = maxPlakaYaziYukseklik / plakaTextHeight;
            const newSize = plakaYaziFontSize * scale;
            plakaTextGeo.dispose();
            plakaTextGeo = new THREE.TextGeometry(plakaText, {
                font: loadedFont,
                size: newSize,
                height: kabartmaYuksekligi * 0.5,
                curveSegments: 8
            });
            plakaTextGeo.computeBoundingBox();
            plakaTextWidth = plakaTextGeo.boundingBox.max.x - plakaTextGeo.boundingBox.min.x;
        }

        // ÖNEMLİ: Yazı Z konumu beyazZ (zemine basar, havada durmaz)
        const plakaTextMesh = new THREE.Mesh(plakaTextGeo, siyahTextMat);
        plakaTextMesh.position.set(
            plakaYaziAlanX + (plakaYaziAlanGenislik - plakaTextWidth) / 2,
            plakaYaziY - plakaYaziFontSize / 2.5,
            beyazZ + 0.1
        );
        keychainGroup.add(plakaTextMesh);

        // ============================================
        // 5. İSİM ŞERİDİ (SİYAH ZEMİN + BEYAZ YAZI)
        // ============================================
        const isimSeritY = -yukseklik / 2 + kenarlikKalinlik + isimlikYukseklik / 2;

        // SİYAH ARKA PLAN ŞERİDİ (isim barının arkası)
        const seritGenislik = icGenislik - 1;
        const seritGeo = new THREE.BoxGeometry(seritGenislik, isimlikYukseklik * 0.85, 0.15);
        const seritMesh = new THREE.Mesh(seritGeo, siyahMat);
        seritMesh.position.set(0, isimSeritY, beyazZ + 0.2);
        keychainGroup.add(seritMesh);

        // İsim yazısı (BEYAZ, siyah şeridin üstünde kabartma - ZEMİNE BASAR)
        if (isimText.trim() !== "") {
            const isimFontSize = isimlikYukseklik * 0.55;
            let isimGeo;
            try {
                isimGeo = new THREE.TextGeometry(isimText, {
                    font: loadedFont,
                    size: isimFontSize,
                    height: kabartmaYuksekligi * 0.5,
                    curveSegments: 8
                });
            } catch(e) {
                isimGeo = new THREE.TextGeometry("isim", {
                    font: loadedFont,
                    size: isimFontSize,
                    height: kabartmaYuksekligi * 0.5,
                    curveSegments: 8
                });
            }
            isimGeo.computeBoundingBox();
            let isimWidth = isimGeo.boundingBox.max.x - isimGeo.boundingBox.min.x;

            // İsim yazısı deliğin sağından başlasın
            const isimAlanSol = delikMerkezX + delikCap / 2 + 2;
            const isimAlanGenislik = (uzunluk / 2 - kenarlikKalinlik - 1) - isimAlanSol;
            
            if (isimWidth > isimAlanGenislik && isimWidth > 0) {
                const scale = isimAlanGenislik / isimWidth;
                const newSize = isimFontSize * scale;
                isimGeo.dispose();
                isimGeo = new THREE.TextGeometry(isimText, {
                    font: loadedFont,
                    size: newSize,
                    height: kabartmaYuksekligi * 0.5,
                    curveSegments: 8
                });
                isimGeo.computeBoundingBox();
                isimWidth = isimGeo.boundingBox.max.x - isimGeo.boundingBox.min.x;
                const isimMesh = new THREE.Mesh(isimGeo, beyazTextMat);
                isimMesh.position.set(
                    isimAlanSol + (isimAlanGenislik - isimWidth) / 2,
                    isimSeritY - newSize / 2.5,
                    beyazZ + 0.3
                );
                keychainGroup.add(isimMesh);
            } else {
                const isimMesh = new THREE.Mesh(isimGeo, beyazTextMat);
                isimMesh.position.set(
                    isimAlanSol + (isimAlanGenislik - isimWidth) / 2,
                    isimSeritY - isimFontSize / 2.5,
                    beyazZ + 0.3
                );
                keychainGroup.add(isimMesh);
            }
        }

        keychainGroup.position.set(0, 0, -kalinlik / 2);

        scene.add(keychainGroup);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function downloadSTL() {
        if (!keychainGroup) {
            alert("Model henüz yüklenmedi!");
            return;
        }

        const exporter = new THREE.STLExporter();
        const result = exporter.parse(keychainGroup, { binary: true });

        const blob = new Blob([result], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        
        const plakaText = document.getElementById('plakaText').value || "plaka";
        const arac = VEHICLE_SETTINGS[currentVehicle].isim;
        link.download = `${plakaText.replace(/[^a-zA-Z0-9]/g, '_')}_${arac}_anahtarlik.stl`;
        link.click();
    }

    window.addEventListener('resize', () => {
        const container = document.getElementById('canvas-container');
        if (camera && renderer) {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
    });

    window.onload = init3D;
</script>

</body>
</html>
